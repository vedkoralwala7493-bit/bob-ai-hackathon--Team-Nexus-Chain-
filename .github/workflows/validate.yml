name: ✅ Validate Submission

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Submission Completeness Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq (YAML parser)
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # ── 1. Required files exist ─────────────────────────────────────
      - name: Check required files exist
        run: |
          MISSING=()

          REQUIRED_FILES=(
            "README.md"
            "submission.yaml"
            "docs/problem-statement.md"
            "docs/solution-overview.md"
            "docs/architecture.md"
            "docs/setup-guide.md"
            "demo/demo-video-link.txt"
            "src/index.html"
            "src/style.css"
            "src/script.js"
          )

          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              MISSING+=("❌ Missing: $f")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "Submission validation FAILED — missing required files:"
            printf '%s\n' "${MISSING[@]}"
            exit 1
          fi

          echo "✅ All required files present."

      # ── 2. submission.yaml is valid YAML ─────────────────────────────
      - name: Validate submission.yaml
        run: |
          yq '.' submission.yaml > /dev/null
          echo "✅ submission.yaml is valid YAML."

      # ── 3. Required submission fields ────────────────────────────────
      - name: Check required fields in submission.yaml
        run: |
          ERRORS=()

          check_field() {
            local path="$1"
            local label="$2"
            local val

            val=$(yq "$path" submission.yaml 2>/dev/null)

            if [ -z "$val" ] || [ "$val" = "null" ] || [ "$val" = '""' ]; then
              ERRORS+=("❌ Required field missing or empty: $label ($path)")
            fi
          }

          check_field '.team.name' 'team.name'
          check_field '.team.track' 'team.track'
          check_field '.team.lead.name' 'team.lead.name'
          check_field '.team.lead.email' 'team.lead.email'
          check_field '.submission.title' 'submission.title'
          check_field '.submission.problem_statement' 'submission.problem_statement'
          check_field '.submission.solution_summary' 'submission.solution_summary'

          # Validate track
          TRACK=$(yq '.team.track' submission.yaml)

          if [[ ! "$TRACK" =~ ^(AI|DevOps|Sustainability|Open)$ ]]; then
            ERRORS+=(
              "❌ team.track must be one of: AI | DevOps | Sustainability | Open (got: $TRACK)"
            )
          fi

          # Check key features
          FEATURES=$(yq '.submission.key_features | length' submission.yaml)

          if [ "$FEATURES" -lt 1 ]; then
            ERRORS+=(
              "❌ submission.key_features must have at least 1 entry"
            )
          fi

          if [ ${#ERRORS[@]} -gt 0 ]; then
            echo "Submission validation FAILED:"
            printf '%s\n' "${ERRORS[@]}"
            exit 1
          fi

          echo "✅ All required submission.yaml fields are filled."

      # ── 4. Check actual project code ─────────────────────────────────
      - name: Check project source files
        run: |
          CODE_FILES=0

          for f in src/index.html src/style.css src/script.js; do
            if [ -s "$f" ]; then
              CODE_FILES=$((CODE_FILES + 1))
            fi
          done

          if [ "$CODE_FILES" -lt 3 ]; then
            echo "❌ One or more main project files are missing or empty."
            echo "Expected: src/index.html, src/style.css, src/script.js"
            exit 1
          fi

          echo "✅ Main project files are present and non-empty."

      # ── 5. Basic HTML/JS validation ──────────────────────────────────
      - name: Check frontend files
        run: |
          if ! grep -qi "<html" src/index.html; then
            echo "❌ src/index.html does not appear to contain valid HTML."
            exit 1
          fi

          if ! grep -q "style.css" src/index.html; then
            echo "⚠️ Warning: style.css is not linked in src/index.html."
          fi

          if ! grep -q "script.js" src/index.html; then
            echo "⚠️ Warning: script.js is not linked in src/index.html."
          fi

          echo "✅ Frontend files passed basic checks."

      # ── 6. Demo video link ────────────────────────────────────────────
      - name: Check demo video link
        run: |
          VIDEO_LINK=$(head -1 demo/demo-video-link.txt)

          if [ -z "$VIDEO_LINK" ]; then
            echo "❌ demo/demo-video-link.txt is empty."
            exit 1
          fi

          if [[ "$VIDEO_LINK" == *"your-demo-video-link-here"* ]]; then
            echo "❌ Demo video link still contains the placeholder."
            exit 1
          fi

          echo "✅ Demo video link is provided."

      # ── 7. README placeholders ───────────────────────────────────────
      - name: Check README placeholders
        run: |
          if grep -q "\[Your Project Title Here\]" README.md; then
            echo "❌ README.md still contains project title placeholder."
            exit 1
          fi

          if grep -q "\[Your Team Name\]" README.md; then
            echo "❌ README.md still contains team name placeholder."
            exit 1
          fi

          echo "✅ README.md placeholders appear to be replaced."

      # ── 8. Documentation checks ──────────────────────────────────────
      - name: Check documentation
        run: |
          DOCS=(
            "docs/problem-statement.md"
            "docs/solution-overview.md"
            "docs/architecture.md"
            "docs/setup-guide.md"
          )

          for doc in "${DOCS[@]}"; do
            if [ ! -s "$doc" ]; then
              echo "❌ Documentation file is empty: $doc"
              exit 1
            fi
          done

          echo "✅ Documentation files are present and non-empty."

      # ── Summary ───────────────────────────────────────────────────────
      - name: Validation passed
        run: |
          echo ""
          echo "🎉 ChainGuard AI submission validation passed!"
          echo ""
          echo "Team:  $(yq '.team.name' submission.yaml)"
          echo "Title: $(yq '.submission.title' submission.yaml)"
          echo "Track: $(yq '.team.track' submission.yaml)"
          echo ""
          echo "✅ Repository structure looks complete."

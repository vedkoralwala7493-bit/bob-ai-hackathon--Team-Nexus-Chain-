submission:
  title: "ChainGuard AI"

  problem_statement: >
    Supply-chain operations can be disrupted by route blockages, delays,
    temperature risks and limited fleet availability. Logistics teams need
    a clear way to assess disruption conditions, compare alternate routes
    and choose an operationally suitable response.

  solution_summary: >
    ChainGuard AI is an explainable decision-support prototype that takes
    route, disruption, severity, shipment, temperature and fleet inputs,
    generates alternate routes, validates shipment temperature safety and
    recommends to a suitable route with an operational explanation.

  key_features:
    - "Disruption and severity based route analysis"
    - "Alternate Route A, Route B and Route C generation and comparison"
    - "Shipment temperature safety validation"
    - "Fleet utilisation overview and availability consideration"
    - "Explainable AI route recommendation with decision factors"

  tech_stack:
    languages:
      - "JavaScript"

    frameworks: []

    ibm_technologies: []

    databases: []

    other:
      - "HTML"
      - "CSS"
      - "GitHub Actions"

  what_we_are_most_proud_of: >
    We are most proud of the explainable decision flow of ChainGuard AI.
    Instead of only presenting alternate routes, the prototype connects
    disruption severity, temperature safety, route distance, travel time
    and fleet availability to produce an understandable operational
    recommendation.

  known_limitations: >
    The current submission is an API-free prototype using sample logistics
    data and rule-based decision logic. Live traffic, weather, GPS and
    external fleet data integrations are not yet implemented, and the
    displayed fleet utilisation and operational saving figures are
    prototype/demo estimates rather than real-world measured results.

